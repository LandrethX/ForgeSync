# Patroni for the two-server ForgeSync state database.
#
# What is not here: every password, and the two addresses that differ per
# container. Patroni takes those from PATRONI_* environment variables set
# in compose.yaml, which override anything in this file.
#
# The timings are deliberately short, so a failover can be watched rather
# than waited out: etcd holds the leader key for ttl seconds, each member
# checks in every loop_wait. A real installation would use Patroni's
# defaults (30/10/10).
scope: forgesync
namespace: /forgesync/

restapi:
  listen: 0.0.0.0:8008

etcd3:
  hosts: etcd:2379

bootstrap:
  dcs:
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"
        max_wal_senders: 10
        max_replication_slots: 10
  initdb:
    - encoding: UTF8
    - data-checksums
  # Test only: any address may connect. The containers are on the compose
  # network and the port is published on localhost.
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
  # initdb makes the cluster; ForgeSync's own database is made once, here.
  post_init: /usr/local/bin/patroni-post-init

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/18/bin
  pgpass: /tmp/pgpass
  parameters:
    password_encryption: scram-sha-256

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
