# ForgeSync Phase 0 test environment (Docker Desktop on macOS, Apple Silicon or Intel).
#
# Each service listens inside its container on the same host:port it is
# published on, and has a network alias equal to its public hostname. The
# URL http://forgejo-se.test:3001 therefore works the same from the Mac
# browser and from inside other containers, which OIDC and mirroring need.
# The Mac needs /etc/hosts entries; see README.md.
#
# Nodes SE and DK start by default. DE also starts with --profile three; DE, UK
# and US with --profile all (setup.sh --three / --all).
#
# Ports the browser needs (SceneID, Forgejo, the ForgeSync UI) are published on
# 127.0.0.1 by default. To reach them from other machines, e.g. when the test
# environment runs on a server, set PUBLIC_BIND=0.0.0.0. The database and the
# webhook sink always stay on localhost.

name: forgesync-test

x-forgejo: &forgejo
  image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION}
  restart: unless-stopped
  depends_on:
    sceneid:
      condition: service_healthy
  extra_hosts:
    # ForgeSync controller running on the Mac (go run ...) is reachable here.
    - host.docker.internal:host-gateway

# Settings shared by every node. The image turns GITEA__<section>__<KEY>
# variables into app.ini entries on start.
x-forgejo-env: &forgejo-env
  USER_UID: "1000"
  USER_GID: "1000"
  GITEA__database__DB_TYPE: sqlite3
  GITEA__security__INSTALL_LOCK: "true"
  GITEA__mailer__ENABLED: "false"
  GITEA__log__LEVEL: Info
  # Identity rule: regular users only via SceneID; local accounts are admins
  # created from the CLI.
  GITEA__service__DISABLE_REGISTRATION: "false"
  GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
  GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
  GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
  GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
  GITEA__oauth2_client__USERNAME: nickname
  GITEA__oauth2_client__ACCOUNT_LINKING: auto
  GITEA__oauth2_client__OPENID_CONNECT_SCOPES: profile email
  GITEA__oauth2_client__REGISTER_EMAIL_CONFIRM: "false"
  # Git LFS: the objects large files are kept in. ForgeSync replicates
  # them (replication.lfs), which needs the LFS server on every node.
  GITEA__server__LFS_START_SERVER: "true"
  # Test only: let webhooks and mirrors target private/local addresses.
  GITEA__webhook__ALLOWED_HOST_LIST: "*"
  GITEA__migrations__ALLOW_LOCALNETWORKS: "true"

services:
  sceneid:
    # Keycloak stands in for SceneID (OIDC provider).
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    # Keycloak sizes its Java heap from the memory it sees; cap it so the
    # whole environment fits on a small server.
    mem_limit: 1g
    # PUBLIC_HOST addresses the whole environment by one name or IP (see
    # setup.sh); without it every service keeps its *.test alias, which is
    # also what container-to-container traffic uses either way.
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://${PUBLIC_HOST:-sceneid.test}:8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SCENEID_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SCENEID_ADMIN_PASSWORD}
    volumes:
      - ./sceneid/realm-sceneid.json:/opt/keycloak/data/import/realm-sceneid.json:ro
      # The realm's own login theme: Keycloak's, with the patterned
      # background taken off (sceneid/theme/sceneid/login).
      - ./sceneid/theme/sceneid:/opt/keycloak/themes/sceneid:ro
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:8080:8080"
    networks:
      default:
        aliases: [sceneid.test]
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  forgesync-db:
    # ForgeSync's own state database (not Forgejo's): one server, which is
    # what the environment runs on unless check-db-failover.sh puts the two
    # under "ha" below in its place.
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: forgesync
      POSTGRES_PASSWORD: ${FORGESYNC_DB_PASSWORD}
      POSTGRES_DB: forgesync
    volumes:
      - forgesync-db:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesync -d forgesync"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The same state database, arranged so that losing one server isn't
  # losing the database: two PostgreSQL servers in streaming replication
  # with Patroni deciding which of them is the primary, and etcd holding
  # that decision. Started only by check-db-failover.sh (profile "ha");
  # nothing else in the environment refers to it.
  #
  # Nothing fronts them. The controllers are given both addresses and
  # target_session_attrs=read-write, so each connection goes to whichever
  # server will accept a write, which is what a promotion changes.
  etcd:
    profiles: [ha]
    image: quay.io/coreos/etcd:${ETCD_VERSION}
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcd:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  forgesync-db-a: &patroni
    profiles: [ha]
    build:
      context: ./patroni
      args:
        POSTGRES_VERSION: ${PATRONI_POSTGRES_VERSION}
        PATRONI_VERSION: ${PATRONI_VERSION}
    image: forgesync-patroni:test
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment: &patroni-env
      PATRONI_NAME: forgesync-db-a
      PATRONI_RESTAPI_CONNECT_ADDRESS: forgesync-db-a:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: forgesync-db-a:5432
      PATRONI_SUPERUSER_USERNAME: forgesync
      PATRONI_SUPERUSER_PASSWORD: ${FORGESYNC_DB_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${FORGESYNC_DB_REPLICATION_PASSWORD}
      FORGESYNC_DB_NAME: forgesync
    volumes:
      - forgesync-db-a:/var/lib/postgresql/data
    ports:
      # PostgreSQL and Patroni's own REST API, for psql and the check
      # script. The controllers reach both over the compose network.
      - "127.0.0.1:5443:5432"
      - "127.0.0.1:8008:8008"
    healthcheck: &patroni-health
      test: ["CMD-SHELL", "pg_isready -U forgesync -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 40

  forgesync-db-b:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_NAME: forgesync-db-b
      PATRONI_RESTAPI_CONNECT_ADDRESS: forgesync-db-b:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: forgesync-db-b:5432
    volumes:
      - forgesync-db-b:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5444:5432"
      - "127.0.0.1:8009:8008"
    healthcheck: *patroni-health

  forgesync:
    # The ForgeSync controller with its admin UI, built from this repository.
    # setup.sh starts it once the nodes are configured and tokens exist.
    profiles: [controller]
    build:
      context: ../..
      args:
        VERSION: ${FORGESYNC_VERSION:-dev}
        COMMIT: ${FORGESYNC_COMMIT:-unknown}
    image: forgesync:test
    # Test only: runs as root so it can read the token files bind-mounted
    # from .tokens/ (they are 0600 and owned by whoever ran setup.sh).
    user: "0:0"
    restart: unless-stopped
    depends_on:
      forgesync-db:
        condition: service_healthy
      sceneid:
        condition: service_healthy
      forgejo-se:
        condition: service_healthy
      forgejo-dk:
        condition: service_healthy
    environment:
      # Empty unless check-db-failover.sh sets it, and then it names both
      # servers of the "ha" pair. It overrides database.url in the config
      # file, so the two controllers move together without the generated
      # config being rewritten.
      FORGESYNC_DATABASE_URL: ${FORGESYNC_DATABASE_URL:-}
    volumes:
      - ./.work/forgesync.docker.yaml:/etc/forgesync/forgesync.yaml:ro
      - ./.tokens:/etc/forgesync/tokens:ro
      - forgesync-git:/var/lib/forgesync
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:8090:8090"
    networks:
      default:
        aliases: [forgesync.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  forgesync-b:
    # A second controller sharing the same database: it stands by until the
    # leadership lease runs out, then takes over. setup.sh --standby starts
    # it; without that profile the installation has one controller.
    profiles: [standby]
    build:
      context: ../..
      args:
        VERSION: ${FORGESYNC_VERSION:-dev}
        COMMIT: ${FORGESYNC_COMMIT:-unknown}
    image: forgesync:test
    # Test only: runs as root so it can read the token files bind-mounted
    # from .tokens/ (they are 0600 and owned by whoever ran setup.sh).
    user: "0:0"
    restart: unless-stopped
    depends_on:
      forgesync-db:
        condition: service_healthy
      sceneid:
        condition: service_healthy
      forgejo-se:
        condition: service_healthy
      forgejo-dk:
        condition: service_healthy
    environment:
      # Empty unless check-db-failover.sh sets it, and then it names both
      # servers of the "ha" pair. It overrides database.url in the config
      # file, so the two controllers move together without the generated
      # config being rewritten.
      FORGESYNC_DATABASE_URL: ${FORGESYNC_DATABASE_URL:-}
    volumes:
      - ./.work/forgesync-b.docker.yaml:/etc/forgesync/forgesync.yaml:ro
      - ./.tokens:/etc/forgesync/tokens:ro
      - forgesync-b-git:/var/lib/forgesync
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:8091:8091"
    networks:
      default:
        aliases: [forgesync-b.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  hooksink:
    # Records webhook deliveries for the Phase 0 probes (phase0/).
    image: python:3.13-alpine
    command: ["python", "-u", "/sink.py"]
    environment:
      HOOK_SECRET: ${HOOK_SECRET}
    volumes:
      - ./hooksink/sink.py:/sink.py:ro
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/events')"]
      interval: 5s
      timeout: 5s
      retries: 20

  forgejo-se:
    <<: *forgejo
    environment:
      <<: *forgejo-env
      GITEA__server__DOMAIN: ${PUBLIC_HOST:-forgejo-se.test}
      GITEA__server__HTTP_PORT: "3001"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-forgejo-se.test}:3001/
      GITEA__server__SSH_DOMAIN: forgejo-se.test
      GITEA__server__SSH_PORT: "2221"
    volumes:
      - forgejo-se:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3001:3001"
      - "${PUBLIC_BIND:-127.0.0.1}:2221:22"
    networks:
      default:
        aliases: [forgejo-se.test]
    healthcheck: &forgejo-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${GITEA__server__HTTP_PORT}/api/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  forgejo-dk:
    <<: *forgejo
    environment:
      <<: *forgejo-env
      GITEA__server__DOMAIN: ${PUBLIC_HOST:-forgejo-dk.test}
      GITEA__server__HTTP_PORT: "3002"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-forgejo-dk.test}:3002/
      GITEA__server__SSH_DOMAIN: forgejo-dk.test
      GITEA__server__SSH_PORT: "2222"
    volumes:
      - forgejo-dk:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3002:3002"
      - "${PUBLIC_BIND:-127.0.0.1}:2222:22"
    networks:
      default:
        aliases: [forgejo-dk.test]
    healthcheck: *forgejo-health

  forgejo-de:
    <<: *forgejo
    profiles: [three, all]
    environment:
      <<: *forgejo-env
      GITEA__server__DOMAIN: ${PUBLIC_HOST:-forgejo-de.test}
      GITEA__server__HTTP_PORT: "3003"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-forgejo-de.test}:3003/
      GITEA__server__SSH_DOMAIN: forgejo-de.test
      GITEA__server__SSH_PORT: "2223"
    volumes:
      - forgejo-de:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3003:3003"
      - "${PUBLIC_BIND:-127.0.0.1}:2223:22"
    networks:
      default:
        aliases: [forgejo-de.test]
    healthcheck: *forgejo-health

  forgejo-uk:
    <<: *forgejo
    profiles: [all]
    environment:
      <<: *forgejo-env
      GITEA__server__DOMAIN: ${PUBLIC_HOST:-forgejo-uk.test}
      GITEA__server__HTTP_PORT: "3004"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-forgejo-uk.test}:3004/
      GITEA__server__SSH_DOMAIN: forgejo-uk.test
      GITEA__server__SSH_PORT: "2224"
    volumes:
      - forgejo-uk:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3004:3004"
      - "${PUBLIC_BIND:-127.0.0.1}:2224:22"
    networks:
      default:
        aliases: [forgejo-uk.test]
    healthcheck: *forgejo-health

  forgejo-us:
    <<: *forgejo
    profiles: [all]
    environment:
      <<: *forgejo-env
      GITEA__server__DOMAIN: ${PUBLIC_HOST:-forgejo-us.test}
      GITEA__server__HTTP_PORT: "3005"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-forgejo-us.test}:3005/
      GITEA__server__SSH_DOMAIN: forgejo-us.test
      GITEA__server__SSH_PORT: "2225"
    volumes:
      - forgejo-us:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3005:3005"
      - "${PUBLIC_BIND:-127.0.0.1}:2225:22"
    networks:
      default:
        aliases: [forgejo-us.test]
    healthcheck: *forgejo-health

volumes:
  forgesync-db:
  forgesync-db-a:
  forgesync-db-b:
  etcd:
  forgesync-b-git:
  forgesync-git:
  forgejo-se:
  forgejo-dk:
  forgejo-de:
  forgejo-uk:
  forgejo-us:
