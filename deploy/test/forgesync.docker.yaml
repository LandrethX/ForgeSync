# Controller config for the `forgesync` container in compose.yaml. setup.sh
# appends the `nodes:` list for the nodes it started and writes the result to
# .work/forgesync.docker.yaml, which is what the container reads. For running
# the controller from source on the host instead, see forgesync.yaml.
#
# The browser reaches the UI as http://forgesync.test:8090; add that name to
# /etc/hosts next to the others (see README.md).
# Two controllers can share this database: whichever holds the leadership
# lease does the work and the other stands by. setup.sh --standby starts a
# second one (forgesync-b) from this file; see README.md.
controller:
  name: forgesync-a
  url: http://forgesync.test:8090
  # Short for the test environment, so a failover is quick to watch.
  lease: 10s
  renew: 3s
log:
  level: info
  format: text
http:
  listen: 0.0.0.0:8090
  admin_token_file: /etc/forgesync/tokens/admin.token
  # Plain http in the test environment; production keeps the default (true).
  secure_cookies: false
oidc:
  issuer: http://sceneid.test:8080/realms/sceneid
  client_id: forgesync-admin
  client_secret_file: /etc/forgesync/tokens/sceneid-admin-client.secret
  redirect_url: http://forgesync.test:8090/api/v1/auth/callback
  post_logout_redirect_url: http://forgesync.test:8090/
  roles_claim: roles
  roles:
    administrator: [forgesync-admin]
    operator: [forgesync-operator]
    viewer: [forgesync-viewer]
  # Keep admin-token sign-in in the web UI as a break-glass option.
  allow_token_sign_in: true
database:
  # Test-only credentials (see .env).
  url: postgres://forgesync:forgesync-test-pw@forgesync-db:5432/forgesync?sslmode=disable
health:
  interval: 15s
  timeout: 5s
  failure_threshold: 3
inventory:
  # Webhooks report changes as they happen; the full scan is a safety net
  # for lost deliveries and changes Forgejo sends no webhook for.
  interval: 30m
webhooks:
  # How the Forgejo containers reach the controller (the compose network
  # alias). ForgeSync installs a system webhook on each node pointing here.
  url: http://forgesync.test:8090/api/v1/hooks/forgejo
  secret_file: /etc/forgesync/tokens/webhook.secret
replication:
  enabled: true
  # Issues and their comments, with the repositories' labels and
  # milestones, both directions (internal/issues).
  issues: true
  # Reactions and attachments too: one API call per issue and per comment
  # per node, which the test environment is small enough for.
  reactions: true
  attachments: true
  # Pull requests too: their conversation, never their state, and what
  # people said about the diff.
  pull_requests: true
  reviews: true
  # The people each repository is shared with, and what they may do. This
  # is what lets an assignee be set on a replica at all.
  collaborators: true
  # The organizations that own repositories, their teams and who is in
  # them. Without it a repository owned by one can't be copied to a node
  # that hasn't got the organization.
  organizations: true
  # The owner's own branch protection rules, kept the same everywhere.
  branch_protection: true
  # A repository's settings and topics, kept the same everywhere.
  metadata: true
  # What was published on each tag, and the files with it.
  releases: true
  # Each repository's wiki, which is a second git repository.
  wiki: true
  # Actions variables, and a report of any node missing a secret.
  actions: true
  # ForgeSync's guard on the replicas: people work on the primary, and a
  # guard someone removes is put back (Phase 0 p02).
  protect_replicas: true
  work_dir: /var/lib/forgesync/git
