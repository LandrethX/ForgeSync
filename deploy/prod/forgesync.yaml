# ForgeSync controller, production example.
#
# Copy this next to your secrets, change what's marked, and read
# deploy/prod/README.md for how it's meant to be run: one or three machines,
# sharing one PostgreSQL database, each on its own host.
#
# Every secret is a file. ForgeSync never takes one from the config or
# the environment, so nothing leaks into a process list or a log.
# Paths are resolved against this file's directory.

controller:
  # What this controller is called, in the UI, the log and the audit
  # trail. Give the two different names.
  name: forgesync-a
  # Where people reach *this* controller, so the other's UI can send
  # them here when this one is the one doing the work.
  url: https://forgesync-a.example.org
  # Lower leads. The pair settles on the same controller after a
  # failover instead of wherever leadership happened to land; the other
  # hands the work back when this one returns.
  priority: 1
  # The longest a failover takes, and the longest a controller that has
  # lost the database keeps acting. Renew defaults to a third of it.
  lease: 15s

# The key that seals node tokens in ForgeSync's database, so a node can be
# added from the admin UI instead of by editing this file on every
# controller and restarting each of them. Every controller needs the same
# key; the database never sees it.
#
#   install -d -o root -g forgesync -m 0750 /etc/forgesync/secrets
#   openssl rand -hex 32 > /etc/forgesync/secrets/node-key
#   chown root:forgesync /etc/forgesync/secrets/node-key
#   chmod 0640 /etc/forgesync/secrets/node-key
#
# Copy the same file to every other controller. Back it up somewhere other
# than the database dump, or the two are lost together; losing it means
# entering the node tokens again, which is recoverable, unlike losing the
# database. Leave this out and ForgeSync works as it always did: nodes come
# from the list at the end of this file and their tokens from files.
node_key_file: /etc/forgesync/secrets/node-key

database:
  # The one thing to back up. Every controller uses the same database;
  # that's what pairs them.
  #
  # Where the database is more than one server, name them all and add
  # target_session_attrs=read-write, so each connection goes to whichever
  # one takes writes and a promotion needs nothing changed here:
  #
  #   postgres://forgesync:PW@db-a:5432,db-b:5432,db-c:5432/forgesync?sslmode=require&target_session_attrs=read-write
  #
  # See section 12 of README.md, which also says why three servers and
  # not two.
  url_file: /etc/forgesync/secrets/database.url

http:
  listen: 0.0.0.0:8090
  # The bearer token for the CLI, and the break-glass sign-in that makes
  # the first ForgeSync account. Keep it somewhere a person can reach in
  # an emergency.
  admin_token_file: /etc/forgesync/secrets/admin.token
  # Serving HTTPS here: with tls_listen, `listen` above stays plain HTTP
  # for a reverse proxy on the same host while browsers use HTTPS
  # directly. Without tls_listen, the certificate takes `listen` over.
  # Leave all three out when something in front terminates TLS.
  tls_listen: 0.0.0.0:8443
  tls_cert_file: /etc/forgesync/tls/fullchain.pem
  tls_key_file: /etc/forgesync/tls/privkey.pem
  # systemctl reload forgesyncd re-reads the certificate in place.
  #
  # With a reverse proxy in front, name it here. Without this every
  # request looks as though it came from the proxy: the history records
  # the proxy's address for every sign-in, and the sign-in limiter counts
  # everyone's failures together, so ten wrong passwords from anyone lock
  # out the whole installation for five minutes. Name only the proxies,
  # as addresses or CIDRs; what this decides is whose claim about the
  # client's address is believed.
  # trusted_proxies:
  #   - 127.0.0.1
  #   - 10.0.0.0/8

log:
  level: info
  format: json

health:
  # When every node has gone quiet at once, ask something that is not a
  # Forgejo node whether this controller can reach anything at all. Five
  # nodes in five countries rarely go together; a controller whose own
  # network has gone does. Without this, one local fault is recorded as
  # five node failures and the real cause is never said.
  #
  # Any one of them answering is enough, so a single provider being down
  # or blocked is not read as the network being gone. Asked only when
  # everything is already quiet, so a working installation sends nothing.
  # Set it to [] to turn the question off, or to addresses of your own.
  uplink_check: [1.1.1.1, 9.9.9.9, 8.8.8.8]
  interval: 15s
  timeout: 5s
  failure_threshold: 3

inventory:
  # How often a controller checks whether the installation's nodes are
  # still the ones it started from. A node added or retired in the admin
  # UI takes effect within this: the controller stops, and whatever runs
  # it starts it again a second later. Default 15s.
  node_check: 15s
  # The safety net, not the fast path: webhooks report changes within
  # seconds. Keep this comfortably longer than a full round takes (see
  # docs/PERFORMANCE.md has the measurements; a round logs its own
  # duration), because a round that outlasts the interval just runs
  # continuously.
  interval: 30m
  branch_concurrency: 4

webhooks:
  # How the Forgejo nodes reach *this* controller. Each leader installs
  # its own; the nodes need this host in [webhook] ALLOWED_HOST_LIST.
  url: https://forgesync-a.example.org/api/v1/hooks/forgejo
  secret_file: /etc/forgesync/secrets/webhook.secret

replication:
  enabled: true
  work_dir: /var/lib/forgesync/git # a cache; safe to lose, not to share
  concurrency: 2
  # What is kept the same on every node. Start with git and add the rest
  # once you've watched a round: each one costs API calls per item per
  # node.
  create_missing: true
  auto_fix: true
  hand_off_conflicts: true
  protect_replicas: true
  branch_protection: true
  metadata: true
  collaborators: true
  organizations: true
  releases: true
  wiki: true
  lfs: true
  packages: true
  actions: true
  issues: true
  pull_requests: true
  reviews: true
  reactions: true
  attachments: true
  # How long a replica's own version is kept after the owner chooses the
  # primary's, and how long an archived copy of a deleted repository is
  # kept before it goes for good.
  backup_days: 30

nodes:
  - name: se
    site: SE
    url: https://git-se.example.org
    token_file: /etc/forgesync/secrets/se.token
    # The id of the SceneID login source on that node (they differ per
    # node): forgejo admin auth list.
    sceneid_source_id: 1
  - name: dk
    site: DK
    url: https://git-dk.example.org
    token_file: /etc/forgesync/secrets/dk.token
    sceneid_source_id: 1
  - name: de
    site: DE
    url: https://git-de.example.org
    token_file: /etc/forgesync/secrets/de.token
    sceneid_source_id: 1
