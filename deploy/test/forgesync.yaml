# Controller config for the local test environment. Run from the repo root:
#   go run ./cmd/forgesyncd -config deploy/test/forgesync.yaml
# Relative paths are resolved against this file's directory. The tokens are
# created by setup.sh.
log:
  level: debug
  format: text
http:
  listen: 127.0.0.1:8090
  admin_token_file: .tokens/admin.token
  # Plain http on localhost; production keeps the default (true).
  secure_cookies: false
oidc:
  # SceneID stand-in (Keycloak). Realm roles arrive in the "roles" claim.
  issuer: http://sceneid.test:8080/realms/sceneid
  client_id: forgesync-admin
  client_secret_file: .tokens/sceneid-admin-client.secret
  redirect_url: http://127.0.0.1:8090/api/v1/auth/callback
  post_logout_redirect_url: http://127.0.0.1:8090/
  roles_claim: roles
  roles:
    administrator: [forgesync-admin]
    operator: [forgesync-operator]
    viewer: [forgesync-viewer]
  # Keep admin-token sign-in in the web UI as a break-glass option.
  allow_token_sign_in: true
node_key_file: .tokens/node-key

database:
  # Test-only credentials (see .env). Real deployments use url_file or
  # FORGESYNC_DATABASE_URL instead of an inline URL.
  url: postgres://forgesync:forgesync-test-pw@localhost:5432/forgesync?sslmode=disable
health:
  interval: 15s
  timeout: 5s
  failure_threshold: 3
nodes:
  - name: se
    site: SE
    url: http://forgejo-se.test:3001
    token_file: .tokens/se.token
    # Id of the SceneID login source on this node (forgejo admin auth list).
    sceneid_source_id: 1
  - name: dk
    site: DK
    url: http://forgejo-dk.test:3002
    token_file: .tokens/dk.token
    sceneid_source_id: 1
replication:
  # Copies branches and tags from each repository's primary to the other
  # nodes, for repositories with a primary set. Needs git 2.32+ on the Mac.
  enabled: true
  work_dir: .work/git
